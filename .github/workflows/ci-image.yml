name: CI image

# Build and push the image the CI jobs run in: dependencies, wlroots, the pinned
# SerenityOS checkout and the Lagom framework build (~1.2 GB, an hour or two
# cold). Rebuild it when libgui-wayland's SerenityOS pin or the dependencies in
# scripts/ci-deps.sh move — not per push. See docs/26-ci.md §2.
#
# Bootstrap: run this once (workflow_dispatch) and then set the repository
# variable SDE_CI_IMAGE_READY to `true`, so the CI jobs stop being skipped.

on:
    workflow_dispatch:
    schedule:
        # Weekly, ahead of the nightly suite; the layers above the pins are cached.
        - cron: "23 3 * * 0"
    push:
        paths:
            - "ci/Containerfile"
            - "scripts/ci-deps.sh"
            - ".github/workflows/ci-image.yml"

permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/${{ github.repository_owner }}/sde-ci

jobs:
    build:
        name: build and push
        runs-on: ubuntu-latest
        timeout-minutes: 240
        steps:
            - uses: actions/checkout@v4
            - name: Log in to the container registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Resolve the revisions to bake in
              # Passed as build args so the clone layers are invalidated when either
              # repository moves. Leaving them as `main` meant Docker cached the
              # clones, and the image kept serving a framework from the first build.
              id: revisions
              run: |
                  echo "sde=${{ github.sha }}" >> "$GITHUB_OUTPUT"
                  echo "framework=$(git ls-remote https://github.com/${{ github.repository_owner }}/libgui-wayland main | cut -f1)" >> "$GITHUB_OUTPUT"
            - name: Set up Buildx
              # The default `docker` driver cannot export a registry cache; the
              # container driver can. Without this the build fails before it starts
              # ("Cache export is not supported for the docker driver").
              uses: docker/setup-buildx-action@v3
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ci/Containerfile
                  push: true
                  build-args: |
                      SDE_REVISION=${{ steps.revisions.outputs.sde }}
                      LIBGUI_WAYLAND_REVISION=${{ steps.revisions.outputs.framework }}
                  tags: |
                      ${{ env.IMAGE }}:latest
                      ${{ env.IMAGE }}:${{ github.sha }}
                  # ignore-error: the cache does not exist until the first build
                  # succeeds; without it the importer prints a scary (harmless) error.
                  cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache,ignore-error=true
                  cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
