name: CI

# The suite is headless by design (no DRM, no host compositor, its own runtime
# directories), so it runs in a container on a standard GitHub-hosted runner.
# Both repositories are public, which makes standard runners free and unlimited —
# never switch these jobs to a *larger* runner, those are always billed.
#
# The jobs need the prebuilt image: it carries the pinned SerenityOS checkout,
# the Lagom framework build (~1.2 GB, an hour or two cold) and wlroots, so a job
# only builds the SDE and runs tests. See docs/26-ci.md §2 for the cost model and
# the bootstrap order: run the `ci-image` workflow once, then set the repository
# variable SDE_CI_IMAGE_READY to `true`.

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    schedule:
        # Nightly: the full suite and the (informational) budgets.
        - cron: "17 4 * * *"

permissions:
    contents: read

env:
    CI_IMAGE: ghcr.io/${{ github.repository_owner }}/sde-ci:latest

jobs:
    # Is the image still built from the framework this branch needs?
    #
    # The image bakes libgui-wayland (its patches, the pinned SerenityOS checkout
    # and the framework build). When the port moves, an image from an older
    # framework fails the SDE's patch application deep inside the build, with an
    # error that says nothing about the image -- and every branch then looks
    # broken. The image records what it baked (org.sde.framework-revision, set in
    # Meta/CI/Containerfile), so say so up front instead: this job compares that label
    # with libgui-wayland main, fails with "rebuild the CI image", and starts the
    # rebuild itself.
    image-freshness:
        name: image matches libgui-wayland
        if: ${{ vars.SDE_CI_IMAGE_READY == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            actions: write
        outputs:
            baked: ${{ steps.compare.outputs.baked }}
            current: ${{ steps.compare.outputs.current }}
        steps:
            - name: What the image was built from
              id: compare
              env:
                  IMAGE: ${{ env.CI_IMAGE }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  docker pull "$IMAGE" >/dev/null
                  baked="$(docker inspect --format '{{ index .Config.Labels "org.sde.framework-revision" }}' "$IMAGE")"
                  current="$(git ls-remote https://github.com/${{ github.repository_owner }}/libgui-wayland.git refs/heads/main | cut -f1)"
                  echo "baked=$baked" >> "$GITHUB_OUTPUT"
                  echo "current=$current" >> "$GITHUB_OUTPUT"
                  echo "image baked libgui-wayland: ${baked:-<no label: the image predates the label>}"
                  echo "libgui-wayland main is now: ${current}"
                  if [[ -z "$baked" || "$baked" == "main" || "$baked" != "$current" ]]; then
                      {
                          echo "::error::The CI image is stale: it was built from libgui-wayland '${baked:-unknown}', but main is '${current}'."
                          echo "::error::Rebuild the CI image (Actions -> ci-image -> Run workflow). The SDE's patches are"
                          echo "::error::applied on top of the framework in the image, so a stale one fails patch application"
                          echo "::error::deep in the build; this check exists so that reads as what it is."
                      } | tee -a "$GITHUB_STEP_SUMMARY"
                      # Start the rebuild rather than leaving it to be noticed: the
                      # workflow is idempotent and pushes :latest when it finishes.
                      gh workflow run ci-image.yml --repo "${{ github.repository }}" || true
                      exit 1
                  fi
                  echo "The image's framework matches libgui-wayland main." >> "$GITHUB_STEP_SUMMARY"

    smoke:
        name: smoke (fast tier)
        needs: image-freshness
        # Skipped, not failed, until the image exists (see the header).
        if: ${{ vars.SDE_CI_IMAGE_READY == 'true' && github.event_name != 'schedule' }}
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/${{ github.repository_owner }}/sde-ci:latest
        timeout-minutes: 75
        steps:
            - uses: actions/checkout@v7
            - name: What this job is running on
              run: scripts/ci-environment.sh
            - name: Build the SDE, applications included
              # The applications are not baked into the image (they are the heaviest
              # part of the tree), and a good third of the fast tier needs them:
              # without this they failed with "CrashReporter is missing",
              # "SystemMonitor not built", "TextEditor: No such file or directory".
              run: scripts/build-full-sde.sh --with-apps
            - name: Fast tier
              run: SDE_NO_LIVE_SESSION=1 scripts/run-all-tests.sh --tier fast --timeout 300 --log-dir "$GITHUB_WORKSPACE/ci-logs"
            - name: Upload test logs
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: smoke-logs
                  path: ci-logs/
                  if-no-files-found: ignore

    full:
        name: full suite
        if: ${{ vars.SDE_CI_IMAGE_READY == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/${{ github.repository_owner }}/sde-ci:latest
        timeout-minutes: 180
        steps:
            - uses: actions/checkout@v7
            - name: What this job is running on
              run: scripts/ci-environment.sh
            - name: Build the SDE, applications included
              run: scripts/build-full-sde.sh --with-apps
            - name: Full suite
              run: SDE_NO_LIVE_SESSION=1 scripts/run-all-tests.sh --tier full --timeout 600 --log-dir "$GITHUB_WORKSPACE/ci-logs"
            - name: Upload test logs
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: full-logs
                  path: ci-logs/
                  if-no-files-found: ignore

    budgets:
        name: budgets (informational)
        # The frame and memory budgets are machine-sensitive: a shared runner is
        # not the reference machine, so this job reports rather than gates. The
        # SDE_PERF_* / SDE_SESSION_*_LIMIT_KB knobs let CI loosen a gate without
        # weakening the local budget (docs/25-performance.md §6).
        if: ${{ vars.SDE_CI_IMAGE_READY == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/${{ github.repository_owner }}/sde-ci:latest
        continue-on-error: true
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
            - name: What this job is running on
              run: scripts/ci-environment.sh
            - name: Build the SDE
              # The applications too: the session-memory test measures the desktop
              # (FileManager -d) and includes it in the per-client budgets, and
              # FileManager is an *application* -- a build without --with-apps leaves
              # it out and the test could only report "the desktop never came up".
              run: scripts/build-full-sde.sh --with-apps
            - name: Frame and latency budget
              run: scripts/run-perf-test.sh
            - name: Session memory budget
              run: scripts/run-session-memory-test.sh
