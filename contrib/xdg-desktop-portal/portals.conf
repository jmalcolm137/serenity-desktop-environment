# SDE portal backend selection (install to
# $XDG_CONFIG_HOME/xdg-desktop-portal/portals.conf or
# /usr/share/xdg-desktop-portal/portals.conf).
#
# Prefer the SDE backend (xdg-desktop-portal-serenity) for the interfaces it
# implements, and fall back to gtk for the rest. The frontend interface names
# are org.freedesktop.portal.*; the values are portal backend names (the
# .portal file's basename).
[preferred]
org.freedesktop.portal.Settings=serenity;gtk
org.freedesktop.portal.Account=serenity;gtk
org.freedesktop.portal.Lockdown=serenity;gtk
org.freedesktop.portal.Background=serenity;gtk
org.freedesktop.portal.AppChooser=serenity;gtk
org.freedesktop.portal.Email=serenity;gtk
org.freedesktop.portal.Location=serenity;gtk
org.freedesktop.portal.ProxyResolver=serenity;gtk
org.freedesktop.portal.OpenURI=serenity;gtk
org.freedesktop.portal.Notification=serenity;gtk
org.freedesktop.portal.ScreenCast=serenity;gtk
org.freedesktop.portal.Realtime=serenity;gtk
org.freedesktop.portal.PowerProfileMonitor=serenity;gtk
org.freedesktop.portal.GameMode=serenity;gtk
org.freedesktop.portal.MemoryMonitor=serenity;gtk
org.freedesktop.portal.FileChooser=serenity;gtk
org.freedesktop.portal.Screenshot=serenity;gtk
org.freedesktop.portal.Print=serenity;gtk
org.freedesktop.portal.RemoteDesktop=serenity;gtk
org.freedesktop.portal.GlobalShortcuts=serenity;gtk
org.freedesktop.portal.Wallpaper=serenity;gtk
org.freedesktop.portal.Secret=serenity;gtk
org.freedesktop.portal.USB=serenity;gtk
org.freedesktop.portal.DynamicLauncher=serenity;gtk
org.freedesktop.portal.Access=serenity;gtk

# Interfaces the SDE backend does not implement fall back to gtk.
org.freedesktop.portal.InputCapture=gtk
